name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -c constraints.txt

      - name: CLI smoke test
        run: |
          python -m main --help
          lemonclaw --version

      - name: Run tests with coverage
        run: >-
          python -m pytest -q --disable-warnings
          --cov=agent --cov=channels --cov=config --cov=dao
          --cov=loop --cov=command --cov=main
          --cov-report=term-missing

  quality:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -c constraints.txt

      - name: Ruff
        run: ruff check .

      - name: Basedpyright
        run: basedpyright

      - name: Build wheel and sdist
        run: python -m build

      - name: Dependency check
        run: python -m pip check
