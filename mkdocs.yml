site_name: LemonClaw
site_description: Self-hosted AI digital employee / 可自行部署的 AI 数字员工
site_url: https://nl8590687.github.io/lemonclaw/
repo_url: https://github.com/nl8590687/lemonclaw
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: 'README.md

  '
theme:
  name: mkdocs
plugins:
- search
markdown_extensions:
- tables
- fenced_code
- toc
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
